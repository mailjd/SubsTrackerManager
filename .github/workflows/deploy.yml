name: Deploy

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: substracker-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Check required GitHub Secrets
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_PASSWORD: ${{ secrets.SUBSTRACKER_ADMIN_PASSWORD }}
          SUPERADMIN_PASSWORD: ${{ secrets.SUBSTRACKER_SUPERADMIN_PASSWORD }}
        run: |
          test -n "$CF_API_TOKEN" || (echo "缺少 CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CF_ACCOUNT_ID" || (echo "缺少 CLOUDFLARE_ACCOUNT_ID" && exit 1)
          test -n "$ADMIN_PASSWORD" || (echo "缺少 SUBSTRACKER_ADMIN_PASSWORD" && exit 1)
          test -n "$SUPERADMIN_PASSWORD" || (echo "缺少 SUBSTRACKER_SUPERADMIN_PASSWORD" && exit 1)

      - name: Install dependencies
        run: npm ci

      - name: Lint + Test
        run: |
          npm run lint
          npm test

      - name: Create/upgrade Cloudflare storage
        run: npm run setup
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUBSTRACKER_ADMIN_PASSWORD: ${{ secrets.SUBSTRACKER_ADMIN_PASSWORD }}
          SUBSTRACKER_SUPERADMIN_PASSWORD: ${{ secrets.SUBSTRACKER_SUPERADMIN_PASSWORD }}

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
