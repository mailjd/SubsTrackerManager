name: Safe upgrade

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: substracker-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Verified storage-preserving upgrade
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SUBSTRACKER_BACKUP_PASSWORD: ${{ secrets.SUBSTRACKER_BACKUP_PASSWORD }}
      SUBSTRACKER_WORKER_NAME: ${{ vars.SUBSTRACKER_WORKER_NAME }}
      SUBSTRACKER_WORKER_URL: ${{ vars.SUBSTRACKER_WORKER_URL }}
      SUBSTRACKER_ENVIRONMENT: ${{ vars.SUBSTRACKER_ENVIRONMENT }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Required access and backup secret
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo 'Missing CLOUDFLARE_API_TOKEN' && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo 'Missing CLOUDFLARE_ACCOUNT_ID' && exit 1)
          test "${#SUBSTRACKER_BACKUP_PASSWORD}" -ge 16 || (echo 'Set SUBSTRACKER_BACKUP_PASSWORD, at least 16 characters' && exit 1)
      - run: npm ci
      - name: Syntax, type and regression checks before any deployment
        run: |
          npm run lint
          npm run test:syntax
          npm run test:upgrade
          npm run test:table-contract
          npm run test:workflow
          npm test
      - name: Read original bindings and verify full encrypted pre-upgrade backup
        run: npm run upgrade:prepare
      - name: Preserve pre-upgrade archive before deploying
        uses: actions/upload-artifact@v4
        with:
          name: upgrade-before-deploy-${{ github.run_id }}
          path: upgrade-backups/
          if-no-files-found: error
          retention-days: 90
      - name: Deploy guarded version, drain old jobs and verify maintenance backup
        run: npm run upgrade:stage
      - name: Preserve maintenance archive before applying migration
        uses: actions/upload-artifact@v4
        with:
          name: upgrade-maintenance-${{ github.run_id }}
          path: upgrade-backups/
          if-no-files-found: error
          retention-days: 90
      - name: Apply additive migration, compare originals, restore-test, then unlock
        run: npm run upgrade:finish
      - name: Preserve encrypted recovery state and verification manifests even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upgrade-result-or-recovery-${{ github.run_id }}
          path: upgrade-backups/
          if-no-files-found: warn
          retention-days: 90
