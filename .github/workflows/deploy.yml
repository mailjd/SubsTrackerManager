name: Safe upgrade

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: substracker-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Verified storage-preserving upgrade
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SUBSTRACKER_BACKUP_PASSWORD: ${{ secrets.SUBSTRACKER_BACKUP_PASSWORD }}
      SUBSTRACKER_WORKER_NAME: ${{ vars.SUBSTRACKER_WORKER_NAME }}
      SUBSTRACKER_WORKER_URL: ${{ vars.SUBSTRACKER_WORKER_URL }}
      SUBSTRACKER_ENVIRONMENT: ${{ vars.SUBSTRACKER_ENVIRONMENT }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Deployment entry and configuration preflight (no network / no writes)
        run: npm run deploy:check
      - run: npm ci
      - name: Syntax, type and regression checks before any deployment
        run: |
          npm run test:toolchain
          npm run test:bundle
          npm run lint
          npm run test:syntax
          npm run test:storage
          npm run test:deploy
          npm run test:upgrade
          npm run test:table-contract
          npm run test:workflow
          npm test
      - name: Read original bindings and verify full encrypted pre-upgrade backup
        run: npm run upgrade:prepare
      - name: Preserve pre-upgrade archive before deploying
        uses: actions/upload-artifact@v4
        with:
          name: upgrade-before-deploy-${{ github.run_id }}
          path: upgrade-backups/
          if-no-files-found: error
          retention-days: 90
      - name: Deploy guarded version, drain old jobs and verify maintenance backup
        run: npm run upgrade:stage
      - name: Preserve maintenance archive before applying migration
        uses: actions/upload-artifact@v4
        with:
          name: upgrade-maintenance-${{ github.run_id }}
          path: upgrade-backups/
          if-no-files-found: error
          retention-days: 90
      - name: Apply additive migration, compare originals, restore-test, then unlock
        run: npm run upgrade:finish
      - name: Preserve encrypted recovery state and verification manifests even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upgrade-result-or-recovery-${{ github.run_id }}
          path: upgrade-backups/
          if-no-files-found: warn
          retention-days: 90
      - name: Publish workflow result summary
        if: always()
        shell: bash
        env:
          UPGRADE_JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo '## SubsTracker Safe upgrade 3.3.24'
            echo 'Release runner: GitHub Actions. Cloudflare split Builds is an alternative; never run two publishers concurrently.'
            echo "Job status: $UPGRADE_JOB_STATUS"
            echo 'Deployment is complete ONLY after the acceptance step succeeds and /api/upgrade/status reports maintenance:false.'
            echo 'Download encrypted artifacts below; keep the backup password separately.'
            echo 'If the job stopped after staging, preserve recovery artifacts and follow SAFE_UPGRADE_3.3.24.md. Do not clear storage or bypass the guard.'
          } >> "$GITHUB_STEP_SUMMARY"
