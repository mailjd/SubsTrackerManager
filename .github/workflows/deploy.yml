name: Deploy Cloudflare Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: substracker-pages-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Check required GitHub Secrets
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CF_API_TOKEN" || (echo "缺少 CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CF_ACCOUNT_ID" || (echo "缺少 CLOUDFLARE_ACCOUNT_ID" && exit 1)

      - name: Install dependencies
        run: npm ci

      - name: Lint + Test + Pages build check
        run: |
          npm run lint
          npm test
          npm run build:pages

      - name: Create/upgrade Pages storage and project
        run: npm run setup:pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PAGES_PRODUCTION_BRANCH: ${{ github.ref_name }}
          SUBSTRACKER_PAGES_PROJECT_NAME: ${{ vars.SUBSTRACKER_PAGES_PROJECT_NAME }}

      - name: Deploy Pages
        run: npm run deploy:pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PAGES_BRANCH: ${{ github.ref_name }}

      - name: Deploy hourly scheduler bridge
        run: npm run deploy:pages:cron
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
