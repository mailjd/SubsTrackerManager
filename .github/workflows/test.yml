name: Test

on:
  push:
    branches: [main, master, 'refactor/**']
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Lint + Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Python for offline backup verification fixtures
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm ci

      - name: Type check (JSDoc + // @ts-check)
        run: npm run lint

      - name: Deployment routing and safety regression (local fixtures only)
        run: |
          npm run test:deploy
          npm run test:upgrade

      - name: Run table input contract regression
        run: npm run test:table-contract

      - name: Run current-history / database workflow regression
        run: npm run test:workflow

      - name: Run unit tests
        run: npm test
