name = "subscription-manager"
main = "src/index.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
# 保留在 Cloudflare Dashboard 设置的 Worker Variables；Secret 本身也不会被 deploy 删除
keep_vars = true

[env.production]
name = "subscription-manager"

[env.staging]
name = "subscription-manager-staging"

# KV 与 D1 默认模板不预设固定 ID，运行 npm run setup 自动创建并写入绑定

# 静态资源：托管 public/ 目录下的 JS/CSS/HTML 给浏览器
# 使用方式：浏览器访问 /js/lib/api-client.js 等同于 public/js/lib/api-client.js
# 不命中静态资源的请求由 Worker fetch handler 处理（默认行为）
[assets]
directory = "./public"
binding = "ASSETS"

# 定时任务配置 - 每小时检查一次（UTC）
[triggers]
crons = ["0 * * * *"]

# 非敏感环境变量；SuperAdmin 密码请在 Cloudflare Dashboard 的 Variables and Secrets 中以 Secret 设置
[vars]
ENVIRONMENT = "production"
