<script>
(function(){
'use strict';
const groups={subscriptionNames:'订阅名称',memberLevels:'会员级别',users:'使用人',subscriptionTypes:'订阅类型',categories:'分类标签',accountTypes:'账号类型'};
const columns={group:{label:'资料分组',width:200},value:{label:'名称/内容',width:360},updatedAt:{label:'最後修改時間',width:220}};
const K='baseDatabaseLayoutV1',E='baseDatabaseDraftV1',T='baseDatabaseTemplatesV1',API='/api/ui-preferences/table-templates/base';
const panel=document.getElementById('baseTabPanel'),table=document.getElementById('baseTable');
let rows=[],visible=[],selected=new Set(),active=null,range=null,anchor=null,drag='',busy=false,templates=[];
const defaults=()=>({order:Object.keys(columns),widths:Object.fromEntries(Object.entries(columns).map(([k,v])=>[k,v.width])),hidden:[],sort:{column:'group',direction:'asc'},filters:{}});
function parse(key,fallback,storage=localStorage){try{return JSON.parse(storage.getItem(key))||fallback;}catch{return fallback;}}
function normalize(x){const d=defaults(),order=[...new Set([...(Array.isArray(x?.order)?x.order:[]),...d.order])].filter(k=>columns[k]);return {...d,...x,order,widths:{...d.widths,...x?.widths},hidden:(x?.hidden||[]).filter(k=>columns[k]),filters:x?.filters||{}};}
let layout=normalize(parse(K,defaults())),drafts=parse(E,{},sessionStorage);
const key=r=>JSON.stringify([r.group,r.value]);
const display=(r,c)=>c==='group'?(groups[r.group]||r.group):c==='updatedAt'?(r.updatedAt?formatTime(r.updatedAt):''):String(drafts[key(r)]??r.value);
const raw=(r,c)=>c==='group'?(groups[r.group]||r.group):String(r[c]||'');
function remember(){localStorage.setItem(K,JSON.stringify(layout));if(Object.keys(drafts).length)sessionStorage.setItem(E,JSON.stringify(drafts));else sessionStorage.removeItem(E);buttons();}
function buttons(){document.getElementById('baseSave').disabled=busy||!Object.keys(drafts).length;document.getElementById('baseCancel').disabled=busy||!Object.keys(drafts).length;document.getElementById('baseDelete').disabled=busy||!selected.size;document.getElementById('baseSummary').textContent=visible.length+' 条 / 全库 '+rows.length+' 条 · 已选 '+selected.size+' 条 · 暂存修改 '+Object.keys(drafts).length+' 格';}
async function load(){try{const data=await api('/api/base-data');rows=data.items||[];render();}catch(e){document.getElementById('baseSummary').textContent='加载失败：'+e.message;showToast(e.message,'error');}}
function stage(r,v){if(busy)return;const k=key(r);v=String(v).trim();if(v===r.value)delete drafts[k];else drafts[k]=v;remember();const td=[...table.querySelectorAll('td[data-col="value"]')].find(t=>t.dataset.key===k);td?.classList.toggle('db-cell-pending',Object.hasOwn(drafts,k));}
function render(){
 const group=document.getElementById('baseGroupFilter').value,q=document.getElementById('baseSearch').value.trim().toLowerCase();
 visible=rows.filter(r=>(!group||r.group===group)&&(!q||Object.keys(columns).some(c=>display(r,c).toLowerCase().includes(q)))&&Object.entries(layout.filters).every(([c,v])=>!Array.isArray(v)||v.includes(raw(r,c))));
 if(layout.sort.direction!=='none')visible.sort((a,b)=>raw(a,layout.sort.column).localeCompare(raw(b,layout.sort.column),'zh-CN',{numeric:true})*(layout.sort.direction==='desc'?-1:1));
 const order=layout.order.filter(c=>!layout.hidden.includes(c));
 table.style.minWidth=(50+order.reduce((sum,c)=>sum+Number(layout.widths[c]||columns[c].width),0))+'px';
 table.tHead.rows[0].innerHTML='<th style="width:50px"><input type="checkbox" id="baseSelectAll" aria-label="全选显示资料"></th>'+order.map(c=>'<th data-col="'+c+'" draggable="true" style="width:'+Math.max(80,Math.min(700,Number(layout.widths[c])||columns[c].width))+'px" class="px-4 py-3"><span class="db-header-label">'+columns[c].label+'</span><button class="db-sort-btn '+(Object.hasOwn(layout.filters,c)?'active':'')+'" data-menu="'+c+'" aria-label="'+columns[c].label+' 排序筛选">▾</button><span class="db-resize-grip" data-resize="'+c+'"></span></th>').join('');
 table.tBodies[0].innerHTML=visible.map((r,i)=>'<tr data-row="'+i+'"><td class="px-3 py-3"><input type="checkbox" data-check="'+i+'" '+(selected.has(key(r))?'checked':'')+' aria-label="选择 '+escapeHtml(r.value)+'"></td>'+order.map(c=>'<td data-row="'+i+'" data-col="'+c+'" data-key="'+escapeHtml(key(r))+'" class="px-4 py-3 '+(c==='value'?'db-cell-editable ':'')+(c==='value'&&Object.hasOwn(drafts,key(r))?'db-cell-pending':'')+'">'+escapeHtml(display(r,c)||'—')+'</td>').join('')+'</tr>').join('');
 const all=document.getElementById('baseSelectAll');all.checked=!!visible.length&&visible.every(r=>selected.has(key(r)));all.indeterminate=visible.some(r=>selected.has(key(r)))&&!all.checked;paint();buttons();
}
function finish(){if(!active)return;stage(active.row,active.input.value);active=null;render();}
function edit(td){if(busy||td.dataset.col!=='value')return;finish();const r=visible[Number(td.dataset.row)],actual=table.querySelector('td[data-row="'+td.dataset.row+'"][data-col="value"]');const input=document.createElement('input');input.className='db-cell-editor';input.value=drafts[key(r)]??r.value;actual.textContent='';actual.append(input);active={row:r,input};input.oninput=()=>stage(r,input.value);input.onblur=()=>{if(active?.input===input)finish();};input.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();finish();}if(e.key==='Escape'){e.preventDefault();active=null;render();}};input.focus();input.select();}
function paint(){table.querySelectorAll('td[data-row][data-col]').forEach(td=>{const r=+td.dataset.row,c=layout.order.filter(k=>!layout.hidden.includes(k)).indexOf(td.dataset.col);td.classList.toggle('db-cell-selected',!!range&&r>=range.r1&&r<=range.r2&&c>=range.c1&&c<=range.c2);td.classList.toggle('db-cell-anchor',!!anchor&&r===anchor.r&&c===anchor.c);});}
function pick(td,extend){const r=+td.dataset.row,c=layout.order.filter(k=>!layout.hidden.includes(k)).indexOf(td.dataset.col);if(!extend||!anchor)anchor={r,c};range={r1:Math.min(r,anchor.r),r2:Math.max(r,anchor.r),c1:Math.min(c,anchor.c),c2:Math.max(c,anchor.c)};paint();}
function closeMenu(){document.getElementById('baseHeaderMenu')?.remove();}
function menu(col,button){closeMenu();const rect=button.getBoundingClientRect(),m=document.createElement('div');m.id='baseHeaderMenu';m.className='db-table-sort-menu';m.style.cssText='width:280px;left:'+Math.max(8,Math.min(rect.left,innerWidth-290))+'px;top:'+Math.max(8,Math.min(rect.bottom+4,innerHeight-450))+'px;max-height:85vh;overflow:auto';m.innerHTML='<button data-sort="asc">↑ 升序</button><button data-sort="desc">↓ 降序</button><button data-sort="none">清除排序</button><hr><input class="db-cell-editor" placeholder="搜索筛选值"><button data-all="1">全选</button><button data-all="0">全不选</button><div data-values style="max-height:180px;overflow:auto"></div><button data-apply>应用筛选</button><button data-clear>清除该栏筛选</button>';
 const values=[...new Set(rows.map(r=>raw(r,col)))].sort((a,b)=>a.localeCompare(b,'zh-CN',{numeric:true})),chosen=new Set(layout.filters[col]||values);let q='';
 function draw(){const target=m.querySelector('[data-values]');target.textContent='';values.filter(v=>v.toLowerCase().includes(q)).forEach(v=>{const l=document.createElement('label');l.style.cssText='display:flex;gap:8px;padding:6px';const cb=document.createElement('input');cb.type='checkbox';cb.checked=chosen.has(v);cb.onchange=()=>cb.checked?chosen.add(v):chosen.delete(v);l.append(cb,document.createTextNode(v||'(空白)'));target.append(l);});}
 m.querySelector('input').oninput=e=>{q=e.target.value.toLowerCase();draw();};m.querySelectorAll('[data-all]').forEach(b=>b.onclick=()=>{values.filter(v=>v.toLowerCase().includes(q)).forEach(v=>b.dataset.all==='1'?chosen.add(v):chosen.delete(v));draw();});m.querySelectorAll('[data-sort]').forEach(b=>b.onclick=()=>{layout.sort={column:col,direction:b.dataset.sort};remember();closeMenu();render();});m.querySelector('[data-apply]').onclick=()=>{layout.filters[col]=[...chosen];remember();closeMenu();render();};m.querySelector('[data-clear]').onclick=()=>{delete layout.filters[col];remember();closeMenu();render();};document.body.append(m);draw();
}
table.addEventListener('dblclick',e=>{const th=e.target.closest('th[data-col]');if(th&&!e.target.closest('button,.db-resize-grip')){finish();const c=th.dataset.col;layout.sort={column:c,direction:layout.sort.column===c&&layout.sort.direction==='asc'?'desc':'asc'};remember();render();return;}const td=e.target.closest('td[data-col]');if(td)edit(td);});
table.onclick=e=>{const b=e.target.closest('[data-menu]');if(b){finish();menu(b.dataset.menu,b);}};
table.onchange=e=>{if(e.target.id==='baseSelectAll'){visible.forEach(r=>e.target.checked?selected.add(key(r)):selected.delete(key(r)));render();}if(e.target.dataset.check!==undefined){const r=visible[+e.target.dataset.check];e.target.checked?selected.add(key(r)):selected.delete(key(r));buttons();}};
let selecting=false;table.onmousedown=e=>{const grip=e.target.closest('[data-resize]');if(grip){e.preventDefault();const c=grip.dataset.resize,x=e.clientX,w=Number(layout.widths[c]);function move(ev){layout.widths[c]=Math.max(80,Math.min(700,w+ev.clientX-x));render();}function up(){document.removeEventListener('mousemove',move);document.removeEventListener('mouseup',up);remember();}document.addEventListener('mousemove',move);document.addEventListener('mouseup',up);return;}const td=e.target.closest('td[data-col]');if(td&&!e.target.closest('input')){pick(td,e.shiftKey);selecting=true;}};
table.onmouseover=e=>{const td=e.target.closest('td[data-col]');if(selecting&&e.buttons===1&&td)pick(td,true);};document.addEventListener('mouseup',()=>selecting=false);
table.ondragstart=e=>{if(e.target.closest('[data-resize],[data-menu]')){e.preventDefault();return;}drag=e.target.closest('th')?.dataset.col||'';if(drag)e.dataTransfer.setData('text/plain',drag);};table.ondragover=e=>{if(drag)e.preventDefault();};table.ondrop=e=>{const th=e.target.closest('th[data-col]');if(!th||!drag)return;e.preventDefault();const c=th.dataset.col;if(c!==drag){const arr=layout.order.filter(x=>x!==drag);let i=arr.indexOf(c);if(e.clientX>th.getBoundingClientRect().left+th.offsetWidth/2)i++;arr.splice(i,0,drag);layout.order=arr;range=null;remember();render();}drag='';};table.ondragend=()=>drag='';
document.addEventListener('click',e=>{if(!e.target.closest('#baseHeaderMenu,[data-menu],#baseColumns'))closeMenu();});
document.addEventListener('copy',e=>{if(panel.classList.contains('hidden')||active||!range||['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName))return;const cols=layout.order.filter(c=>!layout.hidden.includes(c));const quote=v=>/[\t\n\r"]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;const txt=visible.slice(range.r1,range.r2+1).map(r=>cols.slice(range.c1,range.c2+1).map(c=>quote(display(r,c))).join('\t')).join('\n');e.preventDefault();e.clipboardData.setData('text/plain',txt);});
document.addEventListener('paste',e=>{if(panel.classList.contains('hidden')||busy||active||!range||['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName))return;const text=e.clipboardData.getData('text/plain'),matrix=parseTabularText(text);if(!matrix.length)return;e.preventDefault();const cols=layout.order.filter(c=>!layout.hidden.includes(c)),one=matrix.length===1&&matrix[0].length===1;for(let r=range.r1;r<=(one?range.r2:Math.min(visible.length-1,range.r1+matrix.length-1));r++){for(let c=range.c1;c<=(one?range.c2:Math.min(cols.length-1,range.c1+(matrix[r-range.r1]?.length||0)-1));c++){if(cols[c]==='value')stage(visible[r],one?matrix[0][0]:matrix[r-range.r1][c-range.c1]);}}render();});
function parseTabularText(text){const out=[];let row=[],v='',quoted=false;for(let i=0;i<text.length;i++){const c=text[i];if(c==='"'){if(quoted&&text[i+1]==='"'){v+='"';i++;}else quoted=!quoted;}else if(!quoted&&(c==='\t'||c==='\n'||c==='\r')){row.push(v);v='';if(c!=='\t'){out.push(row);row=[];if(c==='\r'&&text[i+1]==='\n')i++;}}else v+=c;}if(v||row.length){row.push(v);out.push(row);}return out;}
document.getElementById('baseSave').onclick=async()=>{if(busy)return;finish();const batch=Object.entries(drafts);if(!batch.length)return;busy=true;buttons();let ok=0;const errors=[];try{for(const [k,value] of batch){try{const [group,oldValue]=JSON.parse(k);if(!value)throw new Error('名称不能为空；删除请使用删除功能');const data=await api('/api/base-data',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({group,oldValue,value})});if(!(data.items||[]).some(r=>r.group===group&&r.value===value))throw new Error('写入核验失败');if(drafts[k]===value)delete drafts[k];selected.delete(k);ok++;}catch(e){errors.push(e.message);}}}finally{busy=false;remember();await load();}showToast('保存 '+ok+' 条'+(errors.length?'；失败 '+errors.length+' 条：'+errors.join('；'):''),errors.length?'error':'success');};
document.getElementById('baseCancel').onmousedown=e=>e.preventDefault();document.getElementById('baseCancel').onclick=()=>{if(busy)return;active=null;drafts={};remember();render();};
document.getElementById('baseGroupFilter').onchange=()=>{finish();range=null;render();};document.getElementById('baseSearch').oninput=()=>{range=null;render();};document.getElementById('baseRefresh').onclick=()=>{finish();load();};
document.getElementById('baseAdd').onclick=()=>{document.getElementById('baseAddForm').classList.remove('hidden');document.getElementById('baseAddGroup').value=document.getElementById('baseGroupFilter').value||'subscriptionNames';document.getElementById('baseAddValue').focus();};document.getElementById('baseAddClose').onclick=()=>document.getElementById('baseAddForm').classList.add('hidden');
document.getElementById('baseAddForm').onsubmit=async e=>{e.preventDefault();const button=e.submitter;button.disabled=true;try{await api('/api/menu-options',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({group:document.getElementById('baseAddGroup').value,name:document.getElementById('baseAddValue').value.trim()})});document.getElementById('baseAddValue').value='';await load();showToast('已添加到基础数据库','success');}catch(err){showToast(err.message,'error');}finally{button.disabled=false;}};
document.getElementById('baseDelete').onclick=async()=>{if(busy||!selected.size)return;if(!confirm('删除所选 '+selected.size+' 项基础菜单资料？现有订阅和历史不改写。')||!confirm('再次确认删除所选菜单项？'))return;busy=true;buttons();const errors=[];try{for(const k of [...selected]){try{const [group,name]=JSON.parse(k);await api('/api/menu-options',{method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify({group,name})});selected.delete(k);delete drafts[k];}catch(e){errors.push(e.message);}}}finally{busy=false;remember();await load();}showToast(errors.length?errors.join('；'):'已删除所选资料',errors.length?'error':'success');};
function reset(){layout=defaults();range=null;remember();render();}
document.getElementById('baseReset').onclick=reset;
document.getElementById('baseColumns').onclick=e=>{closeMenu();const m=document.createElement('div');m.id='baseHeaderMenu';m.className='db-table-sort-menu';const r=e.currentTarget.getBoundingClientRect();m.style.cssText='left:'+Math.min(r.left,innerWidth-240)+'px;top:'+(r.bottom+4)+'px';layout.order.forEach(c=>{const l=document.createElement('label');l.style.cssText='display:flex;padding:8px;gap:8px';const cb=document.createElement('input');cb.type='checkbox';cb.checked=!layout.hidden.includes(c);cb.onchange=()=>{layout.hidden=cb.checked?layout.hidden.filter(x=>x!==c):[...layout.hidden,c];remember();render();};l.append(cb,document.createTextNode(columns[c].label));m.append(l);});document.body.append(m);};
function drawTemplates(id=''){const sel=document.getElementById('baseTemplate');sel.innerHTML='<option value="">显示模板</option><option value="__default__">默认模板</option>'+templates.map(t=>'<option value="'+escapeHtml(t.id)+'">'+escapeHtml(t.name)+'</option>').join('');sel.value=id;document.getElementById('baseDeleteTemplate').disabled=!id||id==='__default__';}
async function persistTemplates(next){const data=await api(API,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({templates:next})});templates=data.templates;localStorage.setItem(T,JSON.stringify(templates));}
document.getElementById('baseSaveTemplate').onclick=async()=>{const name=prompt('模板名称（最多 5 个）');if(!name?.trim())return;const n=name.trim(),next=templates.map(x=>({...x})),found=next.find(t=>t.name===n);if(!found&&next.length>=5)return showToast('最多 5 个自定义模板','error');if(found&&!confirm('覆盖同名模板？'))return;const item=found||{id:window.newWorkflowOperationId(),name:n};item.layout=JSON.parse(JSON.stringify(layout));item.updatedAt=new Date().toISOString();if(!found)next.push(item);try{await persistTemplates(next);drawTemplates(item.id);showToast('模板已保存到数据库','success');}catch(e){showToast(e.message,'error');}};
document.getElementById('baseTemplate').onchange=e=>{const id=e.target.value;if(id==='__default__')reset();else{const item=templates.find(t=>t.id===id);if(item){layout=normalize(item.layout);remember();render();}}drawTemplates(id);};
document.getElementById('baseDeleteTemplate').onclick=async()=>{const id=document.getElementById('baseTemplate').value;if(!id||id==='__default__'||!confirm('删除此显示模板？'))return;try{await persistTemplates(templates.filter(t=>t.id!==id));drawTemplates();}catch(e){showToast(e.message,'error');}};
function tab(base){window.commitDatabaseTableEditor?.();finish();closeMenu();document.getElementById('dbTableSortMenu')?.remove();panel.classList.toggle('hidden',!base);document.getElementById('accountTabPanel').classList.toggle('hidden',base);document.getElementById('baseDatabaseTab').setAttribute('aria-selected',String(base));document.getElementById('accountDatabaseTab').setAttribute('aria-selected',String(!base));if(base)load();else loadAccounts();}
document.getElementById('baseDatabaseTab').onclick=()=>tab(true);document.getElementById('accountDatabaseTab').onclick=()=>tab(false);
for(const [g,label] of Object.entries(groups)){for(const id of ['baseGroupFilter','baseAddGroup']){const option=document.createElement('option');option.value=g;option.textContent=label;document.getElementById(id).append(option);}}
load();(async()=>{templates=parse(T,[]);drawTemplates();try{const data=await api(API);const merged=new Map((data.templates||[]).map(t=>[t.name,t]));for(const t of templates)if(!merged.has(t.name)||String(t.updatedAt)>String(merged.get(t.name).updatedAt))merged.set(t.name,t);const next=[...merged.values()].slice(0,5);if(JSON.stringify(next)!==JSON.stringify(data.templates||[]))await persistTemplates(next);else{templates=next;localStorage.setItem(T,JSON.stringify(templates));}drawTemplates();}catch(e){console.warn('基础资料模板同步失败',e);}})();
})();
</script>
