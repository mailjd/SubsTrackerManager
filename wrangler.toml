name = "subscription-manager"
main = "src/index.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[env.production]
name = "subscription-manager"

[env.staging]
name = "subscription-manager-staging"

# KV 与 D1 默认模板不预设固定 ID，运行 npm run setup 自动创建并写入绑定

# 静态资源：托管 public/ 目录下的 JS/CSS/HTML 给浏览器
# 使用方式：浏览器访问 /js/lib/api-client.js 等同于 public/js/lib/api-client.js
# 不命中静态资源的请求由 Worker fetch handler 处理（默认行为）
[assets]
directory = "./public"
binding = "ASSETS"

# 定时任务配置 - 每小时检查一次（UTC）
[triggers]
crons = ["0 * * * *"]

# 非敏感环境变量。
# 管理员密码不要写入此文件；请在 Cloudflare Dashboard → Worker → Settings → Variables and Secrets
# 新增 Secret/Variable：SUBSTRACKER_ADMIN_PASSWORD。
[vars]
ENVIRONMENT = "production"
