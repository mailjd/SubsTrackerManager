# Cloudflare Pages（默认部署目标）
# 运行 `npm run setup:pages` 后会自动写入 KV / D1 的真实绑定 ID。
name = "substracker-manager-pages"
pages_build_output_dir = "./public"
compatibility_date = "2026-09-22"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "production"

# 运行时凭据不要写在本文件。请在 Cloudflare Pages → Settings → Variables and Secrets 中配置：
# - SUBSTRACKER_ADMIN_PASSWORD：可选，首次部署/应急 Admin 回退密码
# - SUBSTRACKER_SUPERADMIN_USERNAME：SuperAdmin 用户名
# - SUBSTRACKER_SUPERADMIN_PASSWORD：SuperAdmin 二级密码（建议 Secret）
# 正式 Admin 用户名/密码可登录后在「系统配置」中修改。
#
# 以下 KV / D1 绑定由 scripts/setup-pages.cjs 自动生成。
