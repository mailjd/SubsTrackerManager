name = "subscription-manager"
main = "src/index.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
# 保留在 Cloudflare Dashboard 设置的 Worker Variables；Secret 本身也不会被 deploy 删除
keep_vars = true

[env.production]
name = "subscription-manager"

[env.staging]
name = "subscription-manager-staging"

# 保留原 Worker/存储 ID；安全升级只读取实际绑定，不创建或改绑新存储。
# 参见 SAFE_UPGRADE_3.3.24.md；npm run setup 仅预检与加密备份。

# 静态资源：托管 public/ 目录下的 JS/CSS/HTML 给浏览器
# 使用方式：浏览器访问 /js/lib/api-client.js 等同于 public/js/lib/api-client.js
# 不命中静态资源的请求由 Worker fetch handler 处理（默认行为）
[assets]
directory = "./public"
binding = "ASSETS"

# 定时任务配置 - 每小时检查一次（UTC）
[triggers]
crons = ["0 * * * *"]

# 非敏感环境变量；SuperAdmin 密码请在 Cloudflare Dashboard 的 Variables and Secrets 中以 Secret 设置
[vars]
ENVIRONMENT = "production"

# Cloudflare Git builds: set Deploy command = npm run deploy:cloudflare. See CLOUDFLARE_SPLIT_DEPLOY_3.3.24.md.
# Upgrade protection: do not bypass the encrypted backup / original-binding checks.
[build]
command = "node scripts/require-safe-upgrade.mjs"

# Storage policy v3.3.24: existing SUBSCRIPTIONS_KV + SUBSCRIPTIONS_DB only.
# Backups use D1 query + KV; no bucket/account activation or object-storage keys required.
